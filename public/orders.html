<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الطلبات - لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">📦 الطلبات الواردة</h2>
    <div id="ordersList"></div>
</div>
<script>
    async function loadOrders() {
        const res = await fetch("http://localhost:4000/api/admin/orders");
        const data = await res.json();
        if(data.success && data.orders.length) {
            document.getElementById("ordersList").innerHTML = data.orders.map(o => `
                <div class="card mb-3">
                    <div class="card-body">
                        <h5>👤 ${o.customerName}</h5>
                        <p>📞 ${o.customerPhone}<br>📍 ${o.customerAddress}</p>
                        <hr>
                        ${o.items.map(i => `<div>${i.productName} - ${i.quantity} × ${i.price} ج.م</div>`).join("")}
                        <hr>
                        <strong>المجموع: ${o.totalPrice} ج.م</strong><br>
                        <span class="badge bg-${o.status === 'pending' ? 'warning' : 'success'}">${o.status}</span>
                    </div>
                </div>
            `).join("");
        }
    }
    loadOrders();
    setInterval(loadOrders, 5000);
</script>
</body>
</html>
